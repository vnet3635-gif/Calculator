<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>Shop Manager</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap"
            rel="stylesheet">
        <style>
:root{--bg:#eef2f6;--surf:#fff;--ink:#12263a;--mute:#5d6f82;--line:#d5dde6;--acc:#2f5bea;--acc-ink:#fff;--warn:#b26a00;--warnbg:#fff1d0;--bad:#c93a3a;--ok:#1f8a5b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1824;--surf:#172536;--ink:#e6edf5;--mute:#93a5b8;--line:#2a3c50;--acc:#6f93ff;--acc-ink:#0e1824;--warn:#ffc35a;--warnbg:#3a2c0d;--bad:#ff7b7b;--ok:#4cc790}}
:root[data-theme="dark"]{--bg:#0e1824;--surf:#172536;--ink:#e6edf5;--mute:#93a5b8;--line:#2a3c50;--acc:#6f93ff;--acc-ink:#0e1824;--warn:#ffc35a;--warnbg:#3a2c0d;--bad:#ff7b7b;--ok:#4cc790}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:18px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}
nav{display:flex;gap:4px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:4px}
nav button{border:0;background:none;padding:8px 16px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--mute)}
nav button[aria-selected="true"]{background:var(--acc);color:var(--acc-ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:24px;font-weight:800}
.stat span{color:var(--mute);font-size:13px}
.stat.warn{background:var(--warnbg);border-color:var(--warn)}
.stat.warn b{color:var(--warn)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
input,select{background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0}
.bar input[type=search]{flex:1;min-width:160px}
.btn{border:1px solid var(--line);background:var(--surf);border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.reg{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media(max-width:820px){.reg{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.prod{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.prod h3{margin:0;font-size:16px}
.prod small{color:var(--mute)}
.price{font-size:20px;font-weight:800}
.prod .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px}
.tag{font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--bg)}
.tag.low{background:var(--warnbg);color:var(--warn)}
.tag.out{background:var(--bad);color:#fff}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px}
.cart{position:sticky;top:12px}
.panel h2{margin:0 0 10px;font-size:18px}
.line{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:800}
.sum div{display:flex;justify-content:space-between;padding:3px 0}
.sum .tot{font-size:22px;font-weight:800;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
.empty{color:var(--mute);padding:22px 8px;text-align:center}
.tbl{width:100%;border-collapse:collapse;background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tblw{overflow-x:auto}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--mute);font-weight:600}
td.act{text-align:right}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink);padding:20px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(8,16,26,.55)}
dialog h2{margin:0 0 12px}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:10px}
label input,label select{display:block;width:100%;margin-top:4px;color:var(--ink);font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.rcpt div{display:flex;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:9}
[hidden]{display:none!important}
@media(prefers-reduced-motion:no-preference){.prod{transition:border-color .15s}.prod:hover{border-color:var(--acc)}}
</style>
    </head>
    <body>
        <div class="wrap">
            <header>
                <h1>Shop Manager</h1>
                <nav role="tablist" id="tabs">
                    <button role="tab" data-t="reg"
                        aria-selected="true">Register</button>
                    <button role="tab" data-t="inv"
                        aria-selected="false">Inventory</button>
                    <button role="tab" data-t="sales"
                        aria-selected="false">Sales</button>
                </nav>
            </header>
            <div class="stats" id="stats"></div>

            <section id="reg">
                <div class="reg">
                    <div>
                        <div class="bar">
                            <input type="search" id="q"
                                placeholder="Search products"
                                aria-label="Search products">
                            <select id="cat"
                                aria-label="Filter by category"></select>
                        </div>
                        <div class="grid" id="grid"></div>
                    </div>
                    <aside class="panel cart" aria-label="Cart">
                        <h2>Current order</h2>
                        <div id="lines"></div>
                        <div class="two" style="margin:12px 0">
                            <label style="margin:0">Discount %<input
                                    type="number" id="disc" min="0" max="100"
                                    value="0"></label>
                            <label style="margin:0">VAT %<input type="number"
                                    id="vat" min="0" max="100"
                                    value="10"></label>
                        </div>
                        <div class="sum" id="sum"></div>
                        <div class="foot" style="justify-content:stretch">
                            <button class="btn" id="clear">Clear</button>
                            <button class="btn pri" id="pay"
                                style="flex:1">Complete sale</button>
                        </div>
                    </aside>
                </div>
            </section>

            <section id="inv" hidden>
                <div class="bar"><button class="btn pri" id="addp">Add
                        product</button></div>
                <div class="tblw"><table
                        class="tbl"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody
                            id="invb"></tbody></table></div>
            </section>

            <section id="sales" hidden>
                <div class="bar"><button class="btn bad" id="wipe">Clear sales
                        history</button></div>
                <div class="tblw"><table
                        class="tbl"><thead><tr><th>Receipt</th><th>Date</th><th>Items</th><th>Total</th><th></th></tr></thead><tbody
                            id="salesb"></tbody></table></div>
            </section>
        </div>

        <dialog id="pd">
            <form method="dialog" id="pf">
                <h2 id="pdt">Add product</h2>
                <label>Name<input id="f-name" required maxlength="60"></label>
                <div class="two">
                    <label>Category<input id="f-cat" required maxlength="30"
                            list="cats"></label>
                    <label>Price ($)<input id="f-price" type="number" min="0"
                            step="0.01" required></label>
                </div>
                <div class="two">
                    <label>Stock<input id="f-stock" type="number" min="0"
                            step="1" required></label>
                    <label>Low-stock alert at<input id="f-low" type="number"
                            min="0" step="1" value="5" required></label>
                </div>
                <datalist id="cats"></datalist>
                <div class="foot"><button type="button" class="btn"
                        id="pcancel">Cancel</button><button class="btn pri"
                        value="save">Save product</button></div>
            </form>
        </dialog>

        <dialog id="rd"><div id="rbody"></div><div class="foot"><button
                    class="btn" id="rprint">Print</button><button
                    class="btn pri" id="rclose">Done</button></div></dialog>

        <script>
(function(){
var KEY="shopmgr.v1", $=function(s){return document.querySelector(s)};
var seed=[
 {id:1,name:"Jasmine rice 5kg",cat:"Grocery",price:6.5,stock:24,low:6},
 {id:2,name:"Palm sugar jar",cat:"Grocery",price:2.2,stock:4,low:5},
 {id:3,name:"Iced coffee can",cat:"Drinks",price:1.1,stock:60,low:12},
 {id:4,name:"Coconut water",cat:"Drinks",price:1.5,stock:18,low:8},
 {id:5,name:"Cotton krama scarf",cat:"Clothing",price:8,stock:9,low:3},
 {id:6,name:"Notebook A5",cat:"Stationery",price:1.8,stock:0,low:5},
 {id:7,name:"Dish soap 500ml",cat:"Household",price:2.9,stock:15,low:4}
];
var S={products:seed,sales:[],nextId:8,nextRcpt:1001}, cart={}, editId=null;
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.products)S=p}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return "$"+(Math.round(n*100)/100).toFixed(2)}
function prod(id){return S.products.find(function(p){return p.id===id})}
function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}

function renderStats(){
  var low=S.products.filter(function(p){return p.stock<=p.low}).length;
  var today=new Date().toDateString(), tsum=0, all=0;
  S.sales.forEach(function(s){all+=s.total;if(new Date(s.date).toDateString()===today)tsum+=s.total});
  var units=S.products.reduce(function(a,p){return a+p.stock},0);
  $("#stats").innerHTML=
   '<div class="stat"><b>'+money(tsum)+'</b><span>Sales today</span></div>'+
   '<div class="stat"><b>'+money(all)+'</b><span>Total revenue</span></div>'+
   '<div class="stat"><b>'+units+'</b><span>Units in stock</span></div>'+
   '<div class="stat'+(low?' warn':'')+'"><b>'+low+'</b><span>Need restocking</span></div>';
}
function cats(){var c=[];S.products.forEach(function(p){if(c.indexOf(p.cat)<0)c.push(p.cat)});return c.sort()}
function renderCats(){
  var cur=$("#cat").value||"";
  $("#cat").innerHTML='<option value="">All categories</option>'+cats().map(function(c){return '<option'+(c===cur?' selected':'')+'>'+esc(c)+'</option>'}).join("");
  $("#cats").innerHTML=cats().map(function(c){return '<option value="'+esc(c)+'">'}).join("");
}
function tag(p){return p.stock===0?'<span class="tag out">Out of stock</span>':p.stock<=p.low?'<span class="tag low">Low: '+p.stock+' left</span>':'<span class="tag">'+p.stock+' in stock</span>'}
function renderGrid(){
  var q=$("#q").value.trim().toLowerCase(), c=$("#cat").value;
  var list=S.products.filter(function(p){return(!c||p.cat===c)&&(!q||p.name.toLowerCase().indexOf(q)>=0)});
  $("#grid").innerHTML=list.length?list.map(function(p){
    return '<div class="prod"><small>'+esc(p.cat)+'</small><h3>'+esc(p.name)+'</h3>'+tag(p)+
     '<div class="row"><span class="price">'+money(p.price)+'</span><button class="btn sm pri" data-add="'+p.id+'"'+(p.stock===0?' disabled':'')+'>Add</button></div></div>'}).join("")
   :'<div class="empty">No products match. Try another search or add products in Inventory.</div>';
}
function totals(){
  var sub=0;Object.keys(cart).forEach(function(id){var p=prod(+id);if(p)sub+=p.price*cart[id]});
  var d=Math.min(100,Math.max(0,+$("#disc").value||0)), v=Math.max(0,+$("#vat").value||0);
  var dv=sub*d/100, tx=(sub-dv)*v/100;
  return{sub:sub,dv:dv,tx:tx,d:d,v:v,total:sub-dv+tx};
}
function renderCart(){
  var ids=Object.keys(cart);
  $("#lines").innerHTML=ids.length?ids.map(function(id){var p=prod(+id);
    return '<div class="line"><div><b>'+esc(p.name)+'</b><br><small>'+money(p.price)+' each</small></div>'+
    '<div class="qty"><button data-dec="'+id+'" aria-label="Decrease">−</button><span>'+cart[id]+'</span><button data-inc="'+id+'" aria-label="Increase">+</button></div>'+
    '<b>'+money(p.price*cart[id])+'</b></div>'}).join(""):'<div class="empty">Cart is empty. Add products from the list.</div>';
  var t=totals();
  $("#sum").innerHTML='<div><span>Subtotal</span><span>'+money(t.sub)+'</span></div>'+
   '<div><span>Discount ('+t.d+'%)</span><span>−'+money(t.dv)+'</span></div>'+
   '<div><span>VAT ('+t.v+'%)</span><span>'+money(t.tx)+'</span></div>'+
   '<div class="tot"><span>Total</span><span>'+money(t.total)+'</span></div>';
  $("#pay").disabled=!ids.length;$("#clear").disabled=!ids.length;
}
function renderInv(){
  $("#invb").innerHTML=S.products.length?S.products.map(function(p){
   return '<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.cat)+'</td><td>'+money(p.price)+'</td><td>'+tag(p)+'</td>'+
   '<td class="act"><button class="btn sm" data-restock="'+p.id+'">+10</button> <button class="btn sm" data-edit="'+p.id+'">Edit</button> <button class="btn sm bad" data-del="'+p.id+'">Delete</button></td></tr>'}).join("")
   :'<tr><td colspan="5" class="empty">No products yet. Use “Add product” to start.</td></tr>';
}
function renderSales(){
  $("#salesb").innerHTML=S.sales.length?S.sales.slice().reverse().map(function(s){
   return '<tr><td>#'+s.id+'</td><td>'+new Date(s.date).toLocaleString()+'</td><td>'+s.items.reduce(function(a,i){return a+i.qty},0)+'</td><td><b>'+money(s.total)+'</b></td><td class="act"><button class="btn sm" data-rc="'+s.id+'">View receipt</button></td></tr>'}).join("")
   :'<tr><td colspan="5" class="empty">No sales yet. Complete a sale on the Register tab.</td></tr>';
}
function all(){renderStats();renderCats();renderGrid();renderCart();renderInv();renderSales()}

function receipt(s){
  $("#rbody").innerHTML='<div class="rcpt"><h2>Receipt #'+s.id+'</h2><small>'+new Date(s.date).toLocaleString()+'</small><hr>'+
   s.items.map(function(i){return '<div><span>'+i.qty+' × '+esc(i.name)+'</span><span>'+money(i.qty*i.price)+'</span></div>'}).join("")+'<hr>'+
   '<div><span>Subtotal</span><span>'+money(s.sub)+'</span></div><div><span>Discount ('+s.d+'%)</span><span>−'+money(s.dv)+'</span></div>'+
   '<div><span>VAT ('+s.v+'%)</span><span>'+money(s.tx)+'</span></div><div style="font-size:20px;font-weight:800;margin-top:6px"><span>Total</span><span>'+money(s.total)+'</span></div></div>';
  $("#rd").showModal();
}
function addToCart(id){var p=prod(id);if(!p)return;var n=(cart[id]||0)+1;if(n>p.stock){toast("Only "+p.stock+" in stock");return}cart[id]=n;renderCart()}

document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var d=b.dataset;
  if(d.t){document.querySelectorAll("#tabs button").forEach(function(x){x.setAttribute("aria-selected",x===b)});["reg","inv","sales"].forEach(function(k){$("#"+k).hidden=k!==d.t});return}
  if(d.add)addToCart(+d.add);
  if(d.inc)addToCart(+d.inc);
  if(d.dec){var id=+d.dec;cart[id]--;if(cart[id]<=0)delete cart[id];renderCart()}
  if(d.restock){prod(+d.restock).stock+=10;save();all();toast("Added 10 units")}
  if(d.del){var p=prod(+d.del);if(confirm('Delete "'+p.name+'"?')){S.products=S.products.filter(function(x){return x.id!==p.id});delete cart[p.id];save();all()}}
  if(d.edit){var q=prod(+d.edit);editId=q.id;$("#pdt").textContent="Edit product";$("#f-name").value=q.name;$("#f-cat").value=q.cat;$("#f-price").value=q.price;$("#f-stock").value=q.stock;$("#f-low").value=q.low;$("#pd").showModal()}
  if(d.rc){receipt(S.sales.find(function(s){return s.id===+d.rc}))}
});
$("#addp").onclick=function(){editId=null;$("#pf").reset();$("#pdt").textContent="Add product";$("#f-low").value=5;$("#pd").showModal()};
$("#pcancel").onclick=function(){$("#pd").close()};
$("#pf").addEventListener("submit",function(){
  var o={name:$("#f-name").value.trim(),cat:$("#f-cat").value.trim(),price:+$("#f-price").value,stock:Math.floor(+$("#f-stock").value),low:Math.floor(+$("#f-low").value)};
  if(editId){Object.assign(prod(editId),o)}else{o.id=S.nextId++;S.products.push(o)}
  save();all();toast("Product saved");
});
$("#q").oninput=renderGrid;$("#cat").onchange=renderGrid;
$("#disc").oninput=renderCart;$("#vat").oninput=renderCart;
$("#clear").onclick=function(){cart={};renderCart()};
$("#pay").onclick=function(){
  var ids=Object.keys(cart);if(!ids.length)return;var t=totals(),items=[];
  ids.forEach(function(id){var p=prod(+id);items.push({name:p.name,price:p.price,qty:cart[id]});p.stock-=cart[id]});
  var s={id:S.nextRcpt++,date:new Date().toISOString(),items:items,sub:t.sub,dv:t.dv,tx:t.tx,d:t.d,v:t.v,total:t.total};
  S.sales.push(s);cart={};save();all();receipt(s);
};
$("#rclose").onclick=function(){$("#rd").close()};
$("#rprint").onclick=function(){window.print()};
$("#wipe").onclick=function(){if(S.sales.length&&confirm("Clear all sales history? Stock levels stay as they are.")){S.sales=[];save();all()}};
all();
})();
</script>
    </body>
</html>
